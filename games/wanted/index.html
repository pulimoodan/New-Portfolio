<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<script src="/scripts/analytics.js"></script>
<title>WANTED — find the face in the crowd</title>
<style>
  :root { color-scheme: light; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; overflow: hidden;
    background: #eef0f3;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #wrap {
    position: fixed; inset: 10px; bottom: 44px;
    display: grid; place-items: center;
    border: 1px solid #dcdee3; border-radius: 10px;
    overflow: hidden;
    background: #ffffff;
  }
  canvas { display: block; }
  #band {
    position: fixed; left: 10px; right: 10px; bottom: 0; height: 44px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 10px; font-weight: 700; letter-spacing: 2px;
    color: rgba(24,26,33,0.4);
    touch-action: auto;
  }
  #band a { color: rgba(24,26,33,0.85); text-decoration: underline; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="band">BREWED CAREFULLY BY <a href="../../index.html">AKBAR ALI</a></div>
<script>
(() => {
  'use strict';

  // ---------- tuning ----------
  // The game is one question asked over and over — which of these is the one in the photo —
  // so every number here exists to control how long that question stays answerable. Crowd
  // size makes it slower to scan; twin similarity makes it slower to decide; the clock makes
  // both of those cost something. Nothing here makes the target harder to SEE, only harder
  // to pick out, which is the difference between a hidden-object game and this.
  const T = {
    // The clock is not a life bar, it's how long the target is on screen for. It walks in at
    // the start of a round and walks out when this runs down — so the timer is a literal
    // description of where a person is, which is the only reason a countdown ever feels like
    // anything. Nothing banks: every round is its own window.
    timeBase: 28, timeDecay: 0.9, timeMin: 11,
    missBase: 3, missStep: 1.5, missCap: 7,  // wrong picks get dearer WITHIN a round, so
                                             // brute-forcing the crowd is never the play
    holdGone: 0.55, holdLeaving: 1.3,   // beat before the scoreboard — short if they're already
                                        // out of frame, a little longer if you can still see them
    introHold: 1.15, introFly: 0.55,   // the briefing beat: photo held up, then pinned away
    crowdBase: 24, crowdPer: 7, crowdCap: 150,
    walkSpeed: 34, speedPer: 0.03, speedCap: 1.55,
    twinFrom: 3,                 // rounds 1-2 are random strangers: learn to read a face first
    grayFrom: 8, tornFrom: 13,   // the photo itself starts failing you
  };

  // ---------- the gene pool ----------
  // A person is thirteen small integers. That's the whole cast — no sprites, no assets. It
  // matters that they're integers and not pixels: difficulty in this game is generated by
  // COPYING the target and changing n of these, so "one detail apart" is a thing the code
  // can actually construct rather than a thing I'd have to hand-draw sixty times.
  const SKIN  = ['#f7d9c4','#f0c2a2','#dda57c','#c68642','#a3673a','#7a4a24','#54301a'];
  const HAIR  = ['#141210','#2e2019','#4a2f1c','#7b4b23','#b07f3c','#d9b26a','#c0562a','#9a9a9a','#e6e3dd','#2f6fd0','#c2418b','#2e9e6b'];
  const SHIRT = ['#e5484d','#f2820a','#f5c518','#4caf50','#0e9f6e','#2196f3','#3f51b5','#9c27b0','#e91e8c','#795548','#37414f','#f5f2ec','#00bcd4','#8bc34a'];
  const PANTS = ['#3c5a8a','#22252b','#5a616b','#a38f68','#57603a','#8c3b3b','#e8e6e0','#5b4636'];

  // Weighted bags rather than flat ranges. A crowd where four people in five wear a hat reads
  // as a costume party; "none" has to be the common case for the hats that do show up to mean
  // anything.
  const W_HAIR  = [0,1,1,2,2,3,3,4,5,5,6,7,8,9,10,10];
  const W_HEAD  = [0,0,0,0,0,0,1,1,2,3,4,5,6,7];
  const W_SHIRT = [0,0,0,0,1,1,2,2,3,4,5];
  const W_FACE  = [0,0,0,0,0,1,2,3,4,5];
  const W_EYES  = [0,0,0,0,1,2,3];
  const W_ACC   = [0,0,0,0,0,0,1,1,2,2,3,4,5,6,7,8];

  const HEIGHTS = [0.92, 1.0, 1.09];
  const BUILDS  = [0.86, 1.0, 1.16];

  // ---------- canvas ----------
  const cvs = document.getElementById('c');
  const ctx = cvs.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  let BASE = 66;               // a person's height in px at mid-depth
  let NARROW = false;          // phone-width: shorter copy, tighter type, smaller readouts
  let yMin = 0, yMax = 0, xMin = 0, xMax = 0;
  const IS_TOUCH = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  const TAU = Math.PI * 2;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const wrap = document.getElementById('wrap');
    W = wrap.clientWidth; H = wrap.clientHeight;
    cvs.width = W * DPR; cvs.height = H * DPR;
    cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // People are sized off the short edge but never below 50px — under that the glasses and
    // the moustache stop being shapes and start being two grey pixels, and the whole game is
    // reading shapes.
    BASE = clamp(Math.min(W, H * 1.4) / 8.5, 50, 88);
    NARROW = W < 560;
    // No header, no frame, no panel: the crowd owns the entire canvas and the readouts float
    // on top of it. The only reserved strip is the height of one head, so the back row isn't
    // decapitated by the top edge.
    yMin = BASE * 0.85 * 1.09 + 6;
    yMax = H - 6;
    if (yMax - yMin < BASE * 0.7) yMin = Math.max(8, yMax - BASE * 0.7);
    xMin = 16; xMax = W - 16;
    layoutCard();
    if (booted) reflow();
  }
  window.addEventListener('resize', resize);

  // ---------- helpers ----------
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);
  const ri = (n) => (Math.random() * n) | 0;
  const bag = (a) => a[(Math.random() * a.length) | 0];
  const INK = '#20232b';
  const ink = (a) => `rgba(24,26,33,${a})`;
  const ACCENT = '#4f46e5', ACCENT_D = '#3730a3', RED = '#e5342b', GOLD = '#b45309', GOOD = '#0e9f6e';

  function rr(x, y, w, h, r) {
    r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  const circle = (x, y, r) => { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.closePath(); };
  const fs = () => { ctx.fill(); ctx.stroke(); };

  // Mixing toward black or white rather than storing a second palette — shoes are just dark
  // trousers, a hood is just a shaded jumper.
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const t = amt < 0 ? 0 : 255, k = Math.abs(amt);
    r = Math.round(lerp(r, t, k)); g = Math.round(lerp(g, t, k)); b = Math.round(lerp(b, t, k));
    return `rgb(${r},${g},${b})`;
  }

  // ---------- audio ----------
  // The whole soundtrack is a room. There are no samples in here — the crowd, the tension and
  // every event are synthesised, because a game about a plaza full of people needs the plaza
  // to be continuous, and a two-second loop of a real crowd gives itself away in about four
  // seconds. Everything is built from the same three primitives below and mixed through one
  // limiter, so nothing can spike when six things land at once.
  //
  // Nothing sounds until the player touches something — the attract crowd is live from the
  // first frame and a browser will rightly refuse an AudioContext before then.
  let AC = null, master = null, ambBus = null, muted = false;
  let noiseBuf = null;

  function ac() {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = muted ? 0 : 1;
      // A limiter rather than careful per-sound levels: the ambience is always running, so
      // every event lands on top of it and the peaks are additive.
      const lim = AC.createDynamicsCompressor();
      lim.threshold.value = -14; lim.knee.value = 12; lim.ratio.value = 8;
      lim.attack.value = 0.004; lim.release.value = 0.18;
      master.connect(lim); lim.connect(AC.destination);
      noiseBuf = makeNoise(4);
      buildAmbience();
    }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }
  // Pink-ish rather than white. White noise is a hiss; a one-pole lowpass on the way in gives
  // it the weight that reads as a room instead of a radio between stations.
  function makeNoise(secs) {
    const len = (AC.sampleRate * secs) | 0;
    const b = AC.createBuffer(1, len, AC.sampleRate), d = b.getChannelData(0);
    let v = 0;
    for (let i = 0; i < len; i++) { v = v * 0.92 + (Math.random() * 2 - 1) * 0.08; d[i] = v * 3.4; }
    return b;
  }

  // ---------- primitives ----------
  function env(g, t, atk, dur, peak) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + atk);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  function out(node, pan) {
    if (pan !== undefined && AC.createStereoPanner) {
      const p = AC.createStereoPanner(); p.pan.value = pan;
      node.connect(p); p.connect(master);
    } else node.connect(master);
  }
  // A pitched hit. `to` glides, `atk` softens the front so nothing clicks.
  function tone(freq, dur, vol, type, o) {
    if (!AC) return;
    o = o || {};
    const t = AC.currentTime + (o.delay || 0);
    const osc = AC.createOscillator(), g = AC.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    env(g, t, o.atk || 0.006, dur, vol);
    osc.connect(g); out(g, o.pan);
    osc.start(t); osc.stop(t + dur + 0.05);
  }
  // A filtered burst of the room's own noise. Everything percussive is this.
  function perc(dur, vol, hz, q, o) {
    if (!AC) return;
    o = o || {};
    const t = AC.currentTime + (o.delay || 0);
    const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    src.playbackRate.value = 0.7 + Math.random() * 0.6;
    const f = AC.createBiquadFilter();
    f.type = o.type || 'bandpass'; f.frequency.setValueAtTime(hz, t); f.Q.value = q || 1;
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    const g = AC.createGain();
    env(g, t, o.atk || 0.004, dur, vol);
    src.connect(f); f.connect(g); out(g, o.pan);
    src.start(t); src.stop(t + dur + 0.05);
  }

  // ---------- the room ----------
  // Four layers, none of which is a crowd on its own:
  //   rumble  — the low weight of a lot of bodies in a space, breathing on a slow LFO
  //   babble  — noise through three vowel bands, each swelling at its own unhurried rate, so
  //             the texture never repeats and never sits still
  //   shuffle — a 2 Hz wobble on the rumble that reads as footfall without being footsteps
  //   voices  — occasional single utterances, panned at random. This is the layer that makes
  //             it a crowd rather than weather; the ear needs individuals to believe a mass.
  let ambRumble = null, ambBands = [], ambLow = null, voiceTimer = 0, ambLevel = 0;
  function buildAmbience() {
    ambBus = AC.createGain(); ambBus.gain.value = 0; ambBus.connect(master);

    const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true; src.start();

    ambLow = AC.createBiquadFilter(); ambLow.type = 'lowpass';
    ambLow.frequency.value = 380; ambLow.Q.value = 0.7;
    ambRumble = AC.createGain(); ambRumble.gain.value = 0.55;
    src.connect(ambLow); ambLow.connect(ambRumble); ambRumble.connect(ambBus);

    const breathe = AC.createOscillator(), bg = AC.createGain();
    breathe.frequency.value = 0.09; bg.gain.value = 0.22;
    breathe.connect(bg); bg.connect(ambRumble.gain); breathe.start();

    const shuffle = AC.createOscillator(), sg = AC.createGain();
    shuffle.frequency.value = 1.9; sg.gain.value = 0.07;
    shuffle.connect(sg); sg.connect(ambRumble.gain); shuffle.start();

    // vowel bands — roughly /u/, /o/, /e/
    [[430, 1.6, 0.30, 0.071, -0.55], [880, 2.1, 0.20, 0.113, 0.15], [1650, 2.6, 0.13, 0.167, 0.6]]
      .forEach(([hz, q, lvl, rate, pan]) => {
        const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = hz; f.Q.value = q;
        const g = AC.createGain(); g.gain.value = lvl;
        const lfo = AC.createOscillator(), lg = AC.createGain();
        lfo.frequency.value = rate; lg.gain.value = lvl * 0.75;
        lfo.connect(lg); lg.connect(g.gain); lfo.start();
        src.connect(f); f.connect(g);
        if (AC.createStereoPanner) { const p = AC.createStereoPanner(); p.pan.value = pan; g.connect(p); p.connect(ambBus); }
        else g.connect(ambBus);
        ambBands.push({ f, g, hz });
      });
  }

  // One person saying one thing, somewhere off to the side. A saw through two formants with a
  // little pitch drift — no words, but the shape of a sentence, which is all the ear wants.
  function voice() {
    if (!AC || ambLevel <= 0.001) return;
    const t = AC.currentTime;
    const dur = 0.14 + Math.random() * 0.26;
    const f0 = 92 + Math.random() * 130;
    const osc = AC.createOscillator(); osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(f0, t);
    osc.frequency.linearRampToValueAtTime(f0 * (0.86 + Math.random() * 0.3), t + dur);
    const a = AC.createBiquadFilter(); a.type = 'bandpass'; a.frequency.value = 500 + Math.random() * 400; a.Q.value = 5;
    const b = AC.createBiquadFilter(); b.type = 'bandpass'; b.frequency.value = 1300 + Math.random() * 900; b.Q.value = 7;
    const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 340;
    const g = AC.createGain();
    const lvl = (0.012 + Math.random() * 0.02) * ambLevel * 22;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(lvl, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(a); osc.connect(b); a.connect(hp); b.connect(hp); hp.connect(g);
    out(g, Math.random() * 1.8 - 0.9);
    osc.start(t); osc.stop(t + dur + 0.05);
  }

  // level  — how full the room is (crowd size)
  // duck   — the photo is up: the room pulls back and narrows, so looking at it feels like
  //          leaning away from the noise
  // stress — the closing window: the babble tightens and a low pressure comes up underneath
  function ambience(level, duck, stress, dt) {
    if (!AC) return;
    const t = AC.currentTime;
    ambLevel = level * (duck ? 0.3 : 1);
    ambBus.gain.setTargetAtTime(ambLevel, t, 0.25);
    ambLow.frequency.setTargetAtTime(duck ? 190 : 380 - stress * 90, t, 0.3);
    for (const band of ambBands) {
      band.f.Q.setTargetAtTime(duck ? 5 : 2 + stress * 3, t, 0.3);
      band.f.frequency.setTargetAtTime(band.hz * (1 + stress * 0.12), t, 0.4);
    }
    // Voices thin out as the room quiets and thicken with the crowd. Scheduled off the game
    // clock rather than a timer, so a backgrounded tab doesn't come back to a queue of shouts.
    voiceTimer -= dt;
    if (voiceTimer <= 0) {
      voiceTimer = (duck ? 1.6 : 0.35) + Math.random() * (duck ? 2.4 : 1.5) * (1 - stress * 0.4);
      voice();
    }
  }

  // ---------- events ----------
  // A case file opening: a soft two-note figure over a paper shuffle.
  const sndRound = () => {
    perc(0.22, 0.05, 2400, 0.9, { to: 900 });
    tone(392, 0.20, 0.05, 'sine', { atk: 0.02 });
    tone(587, 0.34, 0.045, 'sine', { atk: 0.02, delay: 0.11 });
  };
  const sndCard = (up) => {
    perc(0.16, 0.06, up ? 2600 : 1500, 1.1, { to: up ? 1100 : 2400 });
    tone(up ? 660 : 520, 0.09, 0.025, 'sine', { atk: 0.008 });
  };
  // The find. A rising triad with a soft attack so it lands as relief rather than an alarm,
  // plus a short swell of the crowd itself reacting — the room notices.
  const sndFound = () => {
    [[523, 0], [659, 0.075], [784, 0.15], [1047, 0.225]].forEach(([f, d], i) => {
      tone(f, 0.34 - i * 0.03, 0.075, 'triangle', { atk: 0.012, delay: d });
      tone(f * 2, 0.16, 0.02, 'sine', { atk: 0.01, delay: d });
    });
    perc(0.55, 0.05, 700, 0.7, { atk: 0.22, to: 1500 });
  };
  // A wrong accusation: a body-weight thud and a flat, unmusical pair of tones. Deliberately
  // not a buzzer — you didn't break a rule, you got a person wrong.
  const sndMiss = () => {
    tone(140, 0.26, 0.13, 'sine', { to: 62, atk: 0.004 });
    tone(214, 0.20, 0.05, 'square', { to: 196 });
    perc(0.26, 0.09, 320, 0.6, { to: 90 });
  };
  // Woodblock. Dry, short, and it climbs in the last few seconds so the ear can count without
  // anybody having to put a number on the screen.
  const sndTick = (hot) => {
    tone(hot ? 1500 : 1150, 0.045, hot ? 0.075 : 0.04, 'sine', { to: hot ? 900 : 780, atk: 0.002 });
    perc(0.035, hot ? 0.05 : 0.03, 3000, 2.2);
  };
  // They're walking. A low sweep away from you and one flat door-thump.
  const sndLeave = () => {
    tone(300, 0.9, 0.10, 'sawtooth', { to: 70, atk: 0.03 });
    perc(0.5, 0.10, 420, 0.5, { to: 70, delay: 0.18 });
  };
  // Not a fanfare, and not on top of the exit either — it arrives under the scoreboard.
  const sndOver = () => {
    [220, 262, 330].forEach((f, i) => tone(f, 1.5, 0.05, 'triangle', { atk: 0.06, delay: 0.5 + i * 0.04 }));
    tone(110, 1.8, 0.06, 'sine', { atk: 0.08, delay: 0.5 });
  };

  // ---------- genes ----------
  function randomGenes() {
    return {
      skin: ri(SKIN.length), hair: bag(W_HAIR), hairColor: ri(HAIR.length), head: bag(W_HEAD),
      shirt: bag(W_SHIRT), shirtColor: ri(SHIRT.length), alt: ri(SHIRT.length),
      pants: ri(PANTS.length), facial: bag(W_FACE), eyes: bag(W_EYES), acc: bag(W_ACC),
      build: ri(3), height: ri(3),
    };
  }

  // Which genes actually change what you SEE, given the rest of the genes. This is the whole
  // fairness system in one function: a hijab hides the hair, so "different hair" is not a
  // difference; a plain tee hides the second colour, so two people whose only disagreement is
  // `alt` are the same person wearing the same clothes. Without this the generator will
  // cheerfully build a decoy identical to the target and then charge you four seconds for
  // picking it.
  //
  // `height` is deliberately absent. The crowd is drawn in perspective, so a short person at
  // the front is taller on screen than a tall one at the back — height is real variety but it
  // is not evidence, and the game must never hang an answer on it.
  function effective(g) {
    const covered = g.head === 4 || g.head === 5;      // hijab, turban
    const out = ['skin:' + g.skin, 'shirt:' + g.shirt, 'shirtColor:' + g.shirtColor,
                 'pants:' + g.pants, 'facial:' + g.facial, 'eyes:' + g.eyes,
                 'acc:' + g.acc, 'build:' + g.build, 'head:' + g.head];
    if (!covered) {
      out.push('hair:' + g.hair);
      if (g.hair !== 0) out.push('hairColor:' + g.hairColor);
    }
    if (g.shirt === 1 || g.shirt === 3 || g.head !== 0 || g.acc !== 0) out.push('alt:' + g.alt);
    return out;
  }
  // What the photo is currently failing to tell you. A washed-out print loses hue but keeps
  // shape, so grayscale hides the colour genes only; a torn one loses everything below the
  // hip. Both feed straight back into decoy generation — see uniqueFrom.
  function hiddenSet() {
    const h = Object.create(null);
    if (round >= T.grayFrom) { h.skin = h.hairColor = h.shirtColor = h.alt = h.pants = 1; }
    if (round >= T.tornFrom) { h.pants = 1; }
    return h;
  }
  function sig(g, hidden) {
    const e = effective(g), out = [];
    for (const s of e) if (!hidden[s.slice(0, s.indexOf(':'))]) out.push(s);
    return out.join('|');
  }

  const GENE_KEYS = ['skin','hair','hairColor','head','shirt','shirtColor','alt','pants','facial','eyes','acc','build'];
  const GENE_SIZE = {
    skin: SKIN.length, hair: 11, hairColor: HAIR.length, head: 8, shirt: 6,
    shirtColor: SHIRT.length, alt: SHIRT.length, pants: PANTS.length,
    facial: 6, eyes: 4, acc: 9, build: 3,
  };

  // A near-twin: the target, then n details changed. Only genes that are currently doing
  // visible work are candidates, and the result has to survive the same signature check as
  // everyone else — a mutation that turns a striped shirt plain can silently retire `alt` and
  // hand back a copy of the target.
  function makeTwin(target, n, hidden, tsig) {
    for (let attempt = 0; attempt < 24; attempt++) {
      const g = Object.assign({}, target);
      const live = effective(target).map(s => s.slice(0, s.indexOf(':')))
                                   .filter(k => !hidden[k] && GENE_SIZE[k] > 1);
      if (!live.length) break;
      for (let i = 0; i < n && live.length; i++) {
        const k = live.splice(ri(live.length), 1)[0];
        let v = g[k];
        for (let t = 0; t < 12 && v === g[k]; t++) {
          v = k === 'hair' ? bag(W_HAIR) : k === 'head' ? bag(W_HEAD) : k === 'shirt' ? bag(W_SHIRT)
            : k === 'facial' ? bag(W_FACE) : k === 'eyes' ? bag(W_EYES) : k === 'acc' ? bag(W_ACC)
            : ri(GENE_SIZE[k]);
        }
        g[k] = v;
      }
      if (sig(g, hidden) !== tsig) return g;
    }
    return uniqueFrom(tsig, hidden);
  }
  function uniqueFrom(tsig, hidden) {
    for (let i = 0; i < 60; i++) {
      const g = randomGenes();
      if (sig(g, hidden) !== tsig) return g;
    }
    const g = randomGenes(); g.acc = (g.acc + 1) % 9; return g;
  }

  // ---------- state ----------
  const MENU = 0, PLAY = 1, FOUND = 2, DEAD = 3;
  let state = MENU, booted = false;
  let found = 0, round = 1, clock = T.clock0, elapsed = 0;
  let best = +(localStorage.getItem('wanted_best') || 0);
  let misses = 0, dread = 0;
  let foundAt = 0, deadAt = 0, shake = 0, flash = 0;
  let introT = 9, msg = null, hold = 1;
  let people = [], target = null;
  let roundSig = '', roundHidden = Object.create(null);   // what a replacement must not be
  let parts = [], floaters = [], ripples = [];
  let tNow = 0, lastTick = 99;

  const caseNo = () => 2400 + round * 13;

  // The opening beat of every round: the clock is frozen, picks are ignored, the photo is held
  // up in the middle and then pinned to the corner. A round that starts the instant the crowd
  // is rebuilt is a round you spend the first second of just working out what changed.
  const inIntro = () => state === PLAY && introT < T.introHold + T.introFly;
  const introK = () => {
    if (state !== PLAY) return 0;
    if (introT < T.introHold) return 1;
    if (introT < T.introHold + T.introFly) return 1 - (introT - T.introHold) / T.introFly;
    return 0;
  };
  function say(text, color, sub, dur) { msg = { text, color, sub, t: 0, dur: dur || 1.5 }; }

  // ---------- the crowd ----------
  const personH = (p) => BASE * lerp(0.85, 1.15, (p.y - yMin) / Math.max(1, yMax - yMin)) * HEIGHTS[p.g.height];
  const personW = (p) => personH(p) * 0.34;

  function crowdCount() {
    // Measured in area, not in people. A phone holding sixty of these is a solid wall of
    // shoulders with nothing readable in it; the same sixty on a desktop is a plaza.
    const cap = Math.floor(W * (H - yMin) / (4400 * Math.pow(BASE / 66, 2)));
    return clamp(T.crowdBase + round * T.crowdPer, 10, Math.min(T.crowdCap, Math.max(10, cap)));
  }
  // How alike the decoys get. Round 3 is "same person, three things off" — you can still scan
  // for a colour. By round 9 it's one detail, and you have to actually compare.
  const twinDiff = () => Math.max(1, 4 - Math.floor(round / 3));

  // Park a person off the side of the screen and point them in. `deep` spreads the queue out
  // over a few body-widths so a batch of arrivals trickles in instead of marching in abreast.
  function makeEnter(p, deep) {
    const side = Math.random() < 0.5 ? -1 : 1, h = personH(p);
    p.y = rand(yMin, yMax);
    p.x = side < 0 ? xMin - h * rand(0.6, deep ? 5 : 1.5) : xMax + h * rand(0.6, deep ? 5 : 1.5);
    p.dir = -side; p.pause = 0; p.entering = true; p.escaping = false;
    p.enterTo = side < 0 ? xMin + rand(0.08, 0.45) * (xMax - xMin)
                         : xMax - rand(0.08, 0.45) * (xMax - xMin);
    return p;
  }

  function placePerson(g) {
    const p = {
      g, x: rand(xMin, xMax), y: rand(yMin, yMax),
      dir: Math.random() < 0.5 ? -1 : 1,
      sp: rand(0.75, 1.3), ph: rand(0, TAU),
      pause: Math.random() < 0.22 ? rand(0.4, 2.6) : 0,
      turn: rand(2, 9), vy: rand(-3, 3), blink: rand(1, 6), wrong: false,
    };
    return p;
  }

  function buildRound() {
    people = [];
    const n = crowdCount();
    const hidden = hiddenSet();
    const tg = randomGenes();
    const tsig = sig(tg, hidden);
    const pool = [tg];
    if (round >= T.twinFrom) {
      const d = twinDiff();
      const nT = Math.min(n - 1, Math.round(round * 1.6));
      // Alternating d and d+1 so a round isn't a single puzzle repeated — a couple of
      // properly close calls, and a wider ring of maybes around them.
      for (let i = 0; i < nT; i++) pool.push(makeTwin(tg, d + (i % 2), hidden, tsig));
    }
    while (pool.length < n) pool.push(uniqueFrom(tsig, hidden));
    for (const g of pool) people.push(placePerson(g));
    target = people[0];
    roundSig = tsig; roundHidden = hidden;
    // The target walks in off the side while the photo is still being held up — but so does a
    // third of the crowd, and people keep arriving and leaving for the whole round. An entrance
    // only works as camouflage if it isn't the only one.
    // The target has somewhere to be. It picks the side it means to leave by at the moment it
    // arrives, and from then on its wandering is quietly weighted that way, so by the time the
    // countdown is nearly out it is already near an edge and can stroll off it. No sprint at
    // zero — the exit was always the plan, you just weren't watching.
    target.leaving = false;
    target.exitSide = Math.random() < 0.5 ? -1 : 1;
    // The attract screen has nobody arriving. A title card with eight people queued in single
    // file off the edge looks like a bug, and there is no round for them to be early for.
    if (state !== MENU) {
      makeEnter(target, true);
      target.exitSide = -target.dir;    // they leave by the door they came in
      // and they don't wander far from it, so the walk back out is a few seconds rather than a
      // march across the whole board with the crowd milling around them
      target.enterTo = target.dir > 0 ? xMin + rand(0.06, 0.30) * (xMax - xMin)
                                      : xMax - rand(0.06, 0.30) * (xMax - xMin);
      const others = people.slice(1);
      for (let i = others.length - 1; i > 0; i--) { const j = ri(i + 1); const t = others[i]; others[i] = others[j]; others[j] = t; }
      const enterN = Math.max(3, Math.round(n * 0.3)) - 1;
      for (let i = 0; i < enterN && i < others.length; i++) makeEnter(others[i], true);
    }
    // Shuffled so the target isn't reliably the first thing drawn, and nudged off the very
    // edge — a target half out of frame is a cheap round, in both directions.
    for (let i = people.length - 1; i > 0; i--) { const j = ri(i + 1); const t = people[i]; people[i] = people[j]; people[j] = t; }
    misses = 0;
    introT = 0; msg = null;
    separate(true);
  }

  // A resize moves the floor under everyone.
  function reflow() {
    for (const p of people) { p.x = clamp(p.x, xMin, xMax); p.y = clamp(p.y, yMin, yMax); }
  }

  // Soft shoulders. Without this a crowd this dense stacks into towers and the person you
  // want spends the round behind somebody's hat; with it the pack keeps shuffling itself
  // open, which is also just what a crowd looks like.
  function separate(hard) {
    const passes = hard ? 6 : 1;
    for (let k = 0; k < passes; k++) {
      for (let i = 0; i < people.length; i++) {
        const a = people[i], ah = personH(a), aw = personW(a);
        // Anyone with somewhere to be walks through the shuffle rather than being shoved
        // around by it — a person on their way out must not be held up by the crowd.
        if (a.entering || a.escaping || a.leaving) continue;
        for (let j = i + 1; j < people.length; j++) {
          const b = people[j];
          if (b.entering || b.escaping || b.leaving) continue;
          const dy = a.y - b.y;
          if (Math.abs(dy) > (ah + personH(b)) * 0.24) continue;
          const need = (aw + personW(b)) * 0.5;
          const dx = a.x - b.x, ad = Math.abs(dx);
          if (ad >= need) continue;
          const push = (need - ad) * 0.5, s = dx === 0 ? (i % 2 ? 1 : -1) : Math.sign(dx);
          a.x += push * s;
          b.x -= push * s;
        }
      }
    }
  }

  function updateCrowd(dt) {
    if (dt <= 0) return;
    const sp = T.walkSpeed * (BASE / 66) * Math.min(T.speedCap, 1 + round * T.speedPer);
    for (const p of people) {
      p.blink -= dt;
      if (p.blink < -0.12) p.blink = rand(1.6, 7);
      // Arriving and leaving both happen at a walk, but a brisk one — you should be able to
      // see it happen out of the corner of your eye without it reading as teleportation.
      if (p.entering) {
        p.x += p.dir * sp * 2.1 * dt;
        p.ph += dt * 13;
        if ((p.dir > 0 && p.x >= p.enterTo) || (p.dir < 0 && p.x <= p.enterTo)) p.entering = false;
        continue;
      }
      // Committed to the exit: no more dawdling, no bouncing off the side, and the pace is
      // re-solved every frame from the distance left and the time left — so the crowd can
      // jostle them and they still step out of frame exactly as the clock lands on zero.
      if (p.leaving || p.escaping) {
        const h = personH(p), stride = sp * p.sp;
        const rem = p.dir < 0 ? p.x - (xMin - h * 1.3) : (xMax + h * 1.3) - p.x;
        const pace = p.escaping ? stride * 1.6
                                : clamp(rem / Math.max(0.5, clock), stride * 0.85, stride * 2.4);
        p.x += p.dir * pace * dt;
        p.ph += dt * p.sp * 9;
        continue;
      }
      // The commit, checked before anything else the target might be doing — including
      // standing still. Every frame it asks how long it would take to walk out from where it
      // is, and the moment that equals what's left on the clock it stops wandering and goes.
      // The countdown isn't a rule imposed on the target, it's a measurement of them: the last
      // seconds of a round are a person visibly heading for the door.
      if (p === target && state === PLAY && !inIntro()) {
        const h = personH(p), stride = sp * p.sp * 1.6;
        const dL = p.x - (xMin - h * 1.3), dR = (xMax + h * 1.3) - p.x;
        // Its planned door, unless the wandering has left the other one closer.
        const side = (p.exitSide < 0 ? dL : dR) <= Math.min(dL, dR) * 1.35 ? p.exitSide : (dL < dR ? -1 : 1);
        const d = side < 0 ? dL : dR;
        if (clock <= d / stride) { p.leaving = true; p.dir = side; p.pause = 0; continue; }
      }
      if (p.pause > 0) { p.pause -= dt; continue; }
      p.x += p.dir * p.sp * sp * dt;
      p.y += p.vy * dt * 0.35;
      p.ph += dt * p.sp * 7.2;
      p.turn -= dt;
      if (p.turn <= 0) {
        // To and fro: most of them just turn around, some stop to look at something. The
        // pauses matter more than the turns — a crowd where everything moves at once reads
        // as a conveyor belt.
        p.turn = rand(2.5, 9);
        if (Math.random() < 0.45) p.pause = rand(0.5, 2.4);
        else if (p === target) p.dir = Math.random() < 0.7 ? p.exitSide : -p.exitSide;
        else p.dir *= -1;
        p.vy = rand(-3, 3);
      }
      // Only the target is on a leash. Everyone else who reaches a side just keeps going and
      // is replaced by somebody new coming the other way, so the board is a street rather than
      // a box — and the one person who never leaves is the one you're looking for, which is a
      // tell nobody is going to spot across a hundred people in twenty seconds.
      if (p === target) {
        if (p.x < xMin) { p.x = xMin; p.dir = 1; }
        else if (p.x > xMax) { p.x = xMax; p.dir = -1; }
      }
      if (p.y < yMin) { p.y = yMin; p.vy = Math.abs(p.vy); }
      else if (p.y > yMax) { p.y = yMax; p.vy = -Math.abs(p.vy); }
    }
    // Anyone who has walked clear of the frame is recycled into a fresh stranger coming in the
    // other side, so the population holds steady while the faces never stop turning over.
    for (const p of people) {
      if (p === target || p.entering) continue;
      const h = personH(p);
      if (p.x < xMin - h * 1.2 || p.x > xMax + h * 1.2) {
        p.g = uniqueFrom(roundSig, roundHidden);
        p.sp = rand(0.75, 1.3); p.turn = rand(2, 9); p.vy = rand(-3, 3); p.wrong = false;
        makeEnter(p, false);
      }
    }

    // The parked photo sits ON the board rather than in a panel beside it, so the board has to
    // make room: anyone who would stand behind the card gets walked out past its right edge.
    // Without this the one person you're looking for can spend a whole round filed under their
    // own mugshot.
    const cz = card, czR = cz.x + cz.w + 10;
    for (const p of people) {
      if (p.escaping || p.entering || p.leaving) continue;
      const h = personH(p), w = personW(p);
      if (p.x - w * 0.6 < czR && p.y > cz.y - 10 && p.y - h < cz.y + cz.h + 10) {
        p.x = czR + w * 0.6;
        if (p.dir < 0) p.dir = 1;
      }
    }
    separate(false);
    people.sort((a, b) => a.y - b.y);      // depth order, and the pick order in reverse
  }

  // Topmost first, because that's the one you can see. On touch a near miss still counts —
  // a fingertip is wider than a face.
  // If you can see them you can accuse them — the only thing that decides that is whether they
  // are on the screen, never what the movement code happens to be calling them. An earlier
  // version skipped anyone still flagged `entering`, which meant a third of a fresh crowd was
  // fully drawn, fully visible and completely unclickable.
  //
  // The box matches the silhouette rather than the torso: an outstretched arm is about 0.25 of
  // a body height either side and a wide-brim hat clears the head, so aiming at either of those
  // has to count. Front-most wins, which is the one your eye picked anyway.
  const hitBox = (p) => {
    const h = personH(p);
    return { hw: Math.max(personW(p) * 0.78, 13), top: h * 1.06 };
  };
  function pickAt(x, y) {
    for (let i = people.length - 1; i >= 0; i--) {
      const p = people[i], b = hitBox(p);
      if (x > p.x - b.hw && x < p.x + b.hw && y > p.y - b.top && y < p.y + 6) return p;
    }
    if (!IS_TOUCH) return null;
    // A fingertip is wider than a face, so a near miss still counts — but only for somebody
    // actually in frame, or a tap near the edge snaps to a stranger halfway out of the door.
    let bestP = null, bd = Math.pow(Math.max(34, BASE * 0.42), 2);
    for (const p of people) {
      if (p.x < xMin - 10 || p.x > xMax + 10) continue;
      const h = personH(p), dx = x - p.x, dy = y - (p.y - h * 0.5), d = dx * dx + dy * dy;
      if (d < bd) { bd = d; bestP = p; }
    }
    return bestP;
  }

  // ---------- drawing a person ----------
  // Everything is drawn in a 100-unit-tall space with the feet at the origin and up being
  // negative, then scaled. Front-facing, never mirrored: the walk is a bob and a step rather
  // than a side-on stride, because you have to be able to read a moustache on someone walking
  // away from you, and because a flipped side-parting would disagree with the photo.
  function drawPerson(g, x, y, h, ph, o) {
    o = o || {};
    const k = h / 100, sw = Math.sin(ph), bw = BUILDS[g.build];
    const skin = SKIN[g.skin], hairC = HAIR[g.hairColor];
    const shirtC = SHIRT[g.shirtColor], altC = SHIRT[g.alt];
    const pantsC = PANTS[g.pants], shoeC = shade(pantsC, -0.5);
    const covered = g.head === 4 || g.head === 5;
    const tw = 36 * bw, shoulderX = tw / 2 - 1;

    if (o.shadow !== false) {
      ctx.fillStyle = `rgba(24,26,33,${o.dim ? 0.05 : 0.10})`;
      ctx.beginPath(); ctx.ellipse(x, y + 1, 17 * k, 4.6 * k, 0, 0, TAU); ctx.fill();
    }

    ctx.save();
    ctx.translate(x, y);
    if (o.lean) ctx.rotate(o.lean);
    ctx.scale(k, k);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.lineWidth = 2.1;
    ctx.strokeStyle = INK;
    if (o.dim) ctx.globalAlpha = 0.34;

    // legs — the feet stay on the floor, so the bob is applied to everything above them
    for (const sg of [-1, 1]) {
      const lift = Math.max(0, sg * sw) * 4;
      ctx.save(); ctx.translate(sg * 6.5, -lift);
      ctx.fillStyle = pantsC; rr(-6, -30, 12, 24, 4); fs();
      ctx.fillStyle = shoeC; rr(-7.5, -7, 15, 7, 3); fs();
      ctx.restore();
    }
    ctx.translate(0, -Math.abs(sw) * 1.8);

    // a pack rides behind the shoulders and only its edges show — which is exactly how you
    // spot one in a crowd from the front
    if (g.acc === 1) { ctx.fillStyle = altC; rr(-23 * bw, -58, 46 * bw, 28, 7); fs(); }

    // bare torso underneath, so vests and low necklines are just less shirt
    ctx.fillStyle = skin; rr(-15 * bw, -60, 30 * bw, 30, 9); ctx.fill();

    const dress = g.shirt === 5, tank = g.shirt === 4;
    const topY = tank ? -53 : -59, botY = dress ? -16 : -28;
    function torsoPath() {
      const a = tw * 1.06, b = tw * (dress ? 1.5 : 0.94);
      ctx.beginPath();
      ctx.moveTo(-a / 2 + 4, topY); ctx.lineTo(a / 2 - 4, topY);
      ctx.quadraticCurveTo(a / 2, topY, a / 2, topY + 5);
      ctx.lineTo(b / 2, botY - 3);
      ctx.quadraticCurveTo(b / 2, botY, b / 2 - 3, botY);
      ctx.lineTo(-b / 2 + 3, botY);
      ctx.quadraticCurveTo(-b / 2, botY, -b / 2, botY - 3);
      ctx.lineTo(-a / 2, topY + 5);
      ctx.quadraticCurveTo(-a / 2, topY, -a / 2 + 4, topY);
      ctx.closePath();
    }
    if (g.shirt === 2) {   // hood, behind the head — drawn before it, obviously
      ctx.fillStyle = shade(shirtC, -0.16); circle(0, -70, 21); fs();
    }
    ctx.fillStyle = shirtC; torsoPath(); fs();
    if (g.shirt === 1) {   // stripes
      ctx.save(); torsoPath(); ctx.clip();
      ctx.fillStyle = altC;
      for (let yy = topY + 4; yy < botY; yy += 12) ctx.fillRect(-tw, yy, tw * 2, 6);
      ctx.restore(); torsoPath(); ctx.stroke();
    } else if (g.shirt === 3) {   // open jacket over a second colour
      ctx.fillStyle = altC; rr(-tw * 0.19, topY + 1, tw * 0.38, botY - topY - 1, 3); fs();
      ctx.beginPath(); ctx.moveTo(-tw * 0.19, topY + 1); ctx.lineTo(-tw * 0.34, topY + 13);
      ctx.moveTo(tw * 0.19, topY + 1); ctx.lineTo(tw * 0.34, topY + 13); ctx.stroke();
    } else if (tank) {
      ctx.fillStyle = shirtC;
      rr(-13, -60, 6, 9, 3); fs(); rr(7, -60, 6, 9, 3); fs();
    } else if (g.shirt === 2) {   // pocket + drawstrings
      ctx.beginPath(); ctx.moveTo(-9, -38); ctx.lineTo(9, -38); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-4, -56); ctx.lineTo(-4, -48); ctx.moveTo(4, -56); ctx.lineTo(4, -48); ctx.stroke();
    } else if (dress) {
      ctx.beginPath(); ctx.moveTo(-tw * 0.42, -34); ctx.lineTo(tw * 0.42, -34); ctx.stroke();
    }

    // arms. The sleeve is a shorter rectangle laid over the same limb, which is the whole
    // difference between a t-shirt and a jacket at this size.
    const sleeve = [11, 11, 25, 25, 0, 13][g.shirt];
    let handX = 0, handY = 0;
    for (const sg of [-1, 1]) {
      const rot = sg * 0.10 + (-sg * sw) * 0.28;
      ctx.save(); ctx.translate(sg * shoulderX, -56); ctx.rotate(rot);
      ctx.fillStyle = skin; rr(-4.5, -3, 9, 30, 4.5); fs();
      if (sleeve > 0) { ctx.fillStyle = shirtC; rr(-5.2, -3, 10.4, sleeve, 4); fs(); }
      ctx.restore();
      if (sg === 1) { handX = shoulderX - 27 * Math.sin(rot); handY = -56 + 27 * Math.cos(rot); }
    }

    ctx.fillStyle = skin; rr(-5, -67, 10, 11, 3); fs();          // neck
    if (g.acc === 3) { ctx.fillStyle = altC; rr(-12, -64, 24, 9, 4); fs(); rr(4, -58, 8, 16, 3); fs(); }

    hairBack(g, hairC, covered);
    ctx.fillStyle = skin; circle(0, -79, 17); fs();               // head
    if (!covered && g.hair !== 4) { ctx.fillStyle = skin; circle(-17, -77, 4); fs(); circle(17, -77, 4); fs(); }
    if (!covered) hairFront(g, hairC);
    face(g, hairC, o);
    headwear(g, altC, skin);
    held(g, altC, handX, handY);

    ctx.restore();

    if (o.mark) {   // a wrong pick stays crossed off — you shouldn't pay twice for one mistake
      ctx.save(); ctx.strokeStyle = RED; ctx.lineWidth = 2.4 * k; ctx.lineCap = 'round';
      const r = 7 * k, cx = x, cy = y - h - 8 * k;
      ctx.beginPath(); ctx.moveTo(cx - r, cy - r); ctx.lineTo(cx + r, cy + r);
      ctx.moveTo(cx + r, cy - r); ctx.lineTo(cx - r, cy + r); ctx.stroke();
      ctx.restore();
    }
  }

  // Hair that lives behind the head. Split from the front half because a ponytail behind an
  // ear and a fringe over an eyebrow are the same gene drawn on opposite sides of a skull.
  function hairBack(g, c, covered) {
    if (covered) {
      if (g.head === 4) {                     // hijab drapes onto the shoulders
        ctx.fillStyle = shade(SHIRT[g.alt], -0.05);
        ctx.beginPath(); ctx.moveTo(-21, -52);
        ctx.quadraticCurveTo(-23, -92, 0, -98); ctx.quadraticCurveTo(23, -92, 21, -52);
        ctx.quadraticCurveTo(0, -46, -21, -52); ctx.closePath(); fs();
      }
      return;
    }
    ctx.fillStyle = c;
    if (g.hair === 4) { circle(0, -83, 21.5); fs(); return; }               // afro
    if (g.hair === 5) { rr(-19.5, -88, 39, 36, 15); fs(); return; }         // long
    if (g.hair === 10) { rr(-20, -89, 40, 31, 15); fs(); return; }          // bob
    if (g.hair === 6) { ctx.beginPath(); ctx.ellipse(16, -69, 7, 11.5, -0.45, 0, TAU); fs(); return; }
    if (g.hair === 7) { circle(0, -97, 8); fs(); return; }                  // bun
    if (g.hair === 9) { for (const sg of [-1, 1]) for (let i = 0; i < 3; i++) { circle(sg * 17, -82 + i * 8, 5); fs(); } }
  }
  function hairFront(g, c) {
    if (g.hair === 0) return;
    ctx.fillStyle = c;
    if (g.hair === 8) {                                                     // mohawk
      ctx.globalAlpha *= 0.9; capHair(2, -80); fs(); ctx.globalAlpha /= 0.9;
      ctx.fillStyle = c; rr(-4.5, -103, 9, 22, 4); fs(); return;
    }
    if (g.hair === 3) {                                                     // side parting
      ctx.beginPath(); ctx.moveTo(-17.6, -78);
      ctx.arc(0, -79, 17.6, Math.PI, 0);
      ctx.lineTo(17.6, -88); ctx.quadraticCurveTo(2, -76, -17.6, -85);
      ctx.closePath(); fs(); return;
    }
    if (g.hair === 2) { ctx.globalAlpha *= 0.82; capHair(3, -85); fs(); ctx.globalAlpha /= 0.82; return; }
    capHair(g.hair === 10 ? 1 : 4, g.hair === 10 ? -88 : -86); fs();
  }
  function capHair(dip, line) {
    ctx.beginPath();
    ctx.moveTo(-17.6, -78);
    ctx.arc(0, -79, 17.6, Math.PI, 0);
    ctx.lineTo(17.6, line);
    ctx.quadraticCurveTo(0, line + dip, -17.6, line);
    ctx.closePath();
  }

  function face(g, hairC, o) {
    const shut = !!(o && o.blink);
    ctx.fillStyle = INK; ctx.strokeStyle = INK; ctx.lineWidth = 1.8;
    if (g.facial === 4) {   // full beard, jaw-wrapping, drawn under the mouth
      ctx.fillStyle = hairC;
      ctx.beginPath(); ctx.moveTo(-16.5, -83);
      ctx.quadraticCurveTo(-15, -60, 0, -60); ctx.quadraticCurveTo(15, -60, 16.5, -83);
      ctx.quadraticCurveTo(0, -74, -16.5, -83); ctx.closePath(); fs();
    } else if (g.facial === 1) {
      ctx.save(); ctx.globalAlpha *= 0.22; ctx.fillStyle = hairC;
      ctx.beginPath(); ctx.moveTo(-15, -76); ctx.quadraticCurveTo(0, -60, 15, -76);
      ctx.quadraticCurveTo(0, -70, -15, -76); ctx.closePath(); ctx.fill(); ctx.restore();
    }
    ctx.fillStyle = INK;
    if (shut) {
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(-9, -80); ctx.lineTo(-3.5, -80); ctx.moveTo(3.5, -80); ctx.lineTo(9, -80); ctx.stroke();
    } else {
      circle(-6.2, -80, 2.2); ctx.fill(); circle(6.2, -80, 2.2); ctx.fill();
    }
    ctx.strokeStyle = shade(hairC, -0.1); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-9.5, -86); ctx.lineTo(-3, -86.6); ctx.moveTo(3, -86.6); ctx.lineTo(9.5, -86); ctx.stroke();
    ctx.strokeStyle = INK; ctx.lineWidth = 1.7;
    if (g.facial !== 5) {
      ctx.beginPath(); ctx.arc(0, -73.5, 4.4, 0.25, Math.PI - 0.25); ctx.stroke();
    }
    if (g.facial === 2 || g.facial === 3) { ctx.fillStyle = hairC; rr(-5.6, -76.6, 11.2, 3.6, 1.8); fs(); }
    if (g.facial === 3) { ctx.fillStyle = hairC; rr(-3.4, -69, 6.8, 6.5, 2.6); fs(); }
    if (g.facial === 5) {   // mask
      ctx.fillStyle = '#dfe7f2'; ctx.lineWidth = 1.8;
      rr(-12, -77, 24, 13, 5); fs();
      ctx.beginPath(); ctx.moveTo(-12, -75); ctx.lineTo(-17, -78); ctx.moveTo(12, -75); ctx.lineTo(17, -78); ctx.stroke();
    }
    if (g.eyes) {
      ctx.lineWidth = 1.9; ctx.strokeStyle = INK;
      if (g.eyes === 1) { circle(-6.6, -80, 5.6); ctx.stroke(); circle(6.6, -80, 5.6); ctx.stroke(); }
      else { rr(-12.4, -84.4, 11.6, 9, 2); ctx.stroke(); rr(0.8, -84.4, 11.6, 9, 2); ctx.stroke(); }
      if (g.eyes === 3) { ctx.fillStyle = 'rgba(24,26,33,0.82)'; rr(-12.4, -84.4, 11.6, 9, 2); ctx.fill(); rr(0.8, -84.4, 11.6, 9, 2); ctx.fill(); }
      ctx.beginPath(); ctx.moveTo(-1.2, -80.6); ctx.lineTo(1.2, -80.6); ctx.stroke();
    }
  }

  function headwear(g, altC, skin) {
    if (!g.head) return;
    ctx.fillStyle = altC; ctx.strokeStyle = INK; ctx.lineWidth = 2.1;
    if (g.head === 1) {                                    // cap, brim toward the viewer
      ctx.beginPath(); ctx.arc(0, -87, 18, Math.PI, 0); ctx.closePath(); fs();
      ctx.beginPath(); ctx.ellipse(0, -86, 20, 5, 0, 0, TAU); fs();
    } else if (g.head === 2) {                             // beanie
      ctx.beginPath(); ctx.arc(0, -88, 18.5, Math.PI, 0); ctx.closePath(); fs();
      rr(-19, -89, 38, 7, 3); fs();
    } else if (g.head === 3) {                             // wide brim
      ctx.beginPath(); ctx.ellipse(0, -89, 30, 6, 0, 0, TAU); fs();
      ctx.beginPath(); ctx.arc(0, -90, 15, Math.PI, 0); ctx.closePath(); fs();
    } else if (g.head === 4) {                             // hijab: a frame around the face
      ctx.beginPath();
      ctx.moveTo(-21, -60); ctx.quadraticCurveTo(-23, -96, 0, -99);
      ctx.quadraticCurveTo(23, -96, 21, -60);
      ctx.quadraticCurveTo(0, -54, -21, -60); ctx.closePath();
      // moveTo before the hole, or ellipse() joins it to the outer path's current point and
      // strokes a line straight across the face.
      ctx.moveTo(13.5, -79);
      ctx.ellipse(0, -79, 13.5, 15.5, 0, 0, TAU);
      ctx.closePath();
      ctx.fill('evenodd'); ctx.stroke();
    } else if (g.head === 5) {                             // turban
      ctx.beginPath(); ctx.arc(0, -86, 19.5, Math.PI, 0); ctx.closePath(); fs();
      rr(-19.5, -88, 39, 8, 4); fs();
      ctx.beginPath(); ctx.moveTo(-14, -94); ctx.quadraticCurveTo(0, -100, 14, -94); ctx.stroke();
    } else if (g.head === 6) {                             // headphones
      ctx.lineWidth = 3.4; ctx.strokeStyle = altC;
      ctx.beginPath(); ctx.arc(0, -80, 20, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
      ctx.lineWidth = 2.1; ctx.strokeStyle = INK;
      rr(-22, -83, 8, 12, 3); fs(); rr(14, -83, 8, 12, 3); fs();
    } else {                                               // bandana
      ctx.beginPath(); ctx.moveTo(-17.4, -84); ctx.quadraticCurveTo(0, -80, 17.4, -84);
      ctx.quadraticCurveTo(0, -95, -17.4, -84); ctx.closePath(); fs();
      ctx.beginPath(); ctx.moveTo(16, -86); ctx.lineTo(23, -80); ctx.lineTo(15, -80); ctx.closePath(); fs();
    }
  }

  // Things carried. They hang off the right hand, whose position falls out of the arm's own
  // rotation, so a briefcase swings with the walk instead of floating beside it.
  function held(g, altC, hx, hy) {
    ctx.strokeStyle = INK; ctx.lineWidth = 2;
    if (g.acc === 1) {                                     // straps for the pack behind
      ctx.strokeStyle = shade(altC, -0.3); ctx.lineWidth = 3.2;
      ctx.beginPath(); ctx.moveTo(-9, -58); ctx.lineTo(-11, -36); ctx.moveTo(9, -58); ctx.lineTo(11, -36); ctx.stroke();
    } else if (g.acc === 2) {                              // satchel across the body
      ctx.strokeStyle = shade(altC, -0.3); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-11, -58); ctx.lineTo(12, -38); ctx.stroke();
      ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.fillStyle = altC;
      rr(9, -40, 16, 13, 3); fs();
    } else if (g.acc === 4) {                              // furled umbrella over the shoulder
      ctx.strokeStyle = shade(altC, -0.4); ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx + 8, hy - 34); ctx.stroke();
      ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.fillStyle = altC;
      ctx.save(); ctx.translate(hx + 6, hy - 26); ctx.rotate(-0.22);
      ctx.beginPath(); ctx.ellipse(0, 0, 4.5, 13, 0, 0, TAU); fs(); ctx.restore();
    } else if (g.acc === 5) {                              // coffee
      ctx.fillStyle = '#f5f2ec'; rr(hx - 4.5, hy - 2, 9, 11, 2); fs();
      ctx.fillStyle = shade(altC, -0.15); rr(hx - 5.2, hy - 4, 10.4, 3.4, 1.5); fs();
    } else if (g.acc === 6) {                              // phone, held up
      ctx.fillStyle = '#2b2f38'; rr(hx - 3.5, hy - 12, 7, 12, 2); fs();
    } else if (g.acc === 7) {                              // briefcase
      ctx.fillStyle = altC; rr(hx - 10, hy + 1, 20, 14, 2); fs();
      ctx.beginPath(); ctx.moveTo(hx - 3, hy + 1); ctx.quadraticCurveTo(hx, hy - 4, hx + 3, hy + 1); ctx.stroke();
    } else if (g.acc === 8) {                              // balloon
      ctx.strokeStyle = ink(0.45); ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(hx, hy); ctx.quadraticCurveTo(hx + 12, hy - 40, hx + 8, hy - 62); ctx.stroke();
      ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.fillStyle = altC;
      ctx.beginPath(); ctx.ellipse(hx + 8, hy - 70, 8, 9.5, 0, 0, TAU); fs();
    }
  }

  // ---------- the case file ----------
  // Two places the photo can be: pinned in the corner where it stays out of the way, and held
  // up in the middle of the board where you can actually read it. Every round starts in the
  // middle and flies to the corner, which is both the briefing and the tutorial for the fact
  // that you can call it back at any time.
  let card = { x: 14, y: 14, w: 80, h: 104 };
  let cardBig = { x: 0, y: 0, w: 0, h: 0 };
  function layoutCard() {
    const h = clamp(Math.min(W, H) * 0.19, 74, 132);
    card = { x: 14, y: H - h - 14, w: h * 0.76, h };
    const bh = clamp(Math.min(H - 110, W * 0.55), 190, 380), bw = bh * 0.76;
    cardBig = { x: W / 2 - bw / 2, y: H * 0.48 - bh / 2, w: bw, h: bh };
  }
  // One number drives both journeys — the briefing flying out to the corner at the start of a
  // round, and you calling it back mid-round. Same path, same easing, so the corner card reads
  // as the same object parked rather than a second widget that appears.
  const cardLift = () => Math.max(introK(), magT);
  const cardRect = () => {
    const k = cardLift();
    if (k <= 0.001) return card;
    const e = k * k * (3 - 2 * k);
    return {
      x: lerp(card.x, cardBig.x, e), y: lerp(card.y, cardBig.y, e),
      w: lerp(card.w, cardBig.w, e), h: lerp(card.h, cardBig.h, e),
    };
  };
  // A fixed zigzag rather than a fresh random one each frame — a tear that reshuffles sixty
  // times a second is a shredder, not a torn photo.
  const TEAR = [0.00, 0.72, 0.14, 0.66, 0.28, 0.74, 0.42, 0.63, 0.55, 0.71, 0.68, 0.64, 0.82, 0.72, 1.00, 0.66];

  function drawCard(x, y, w, h, g, big) {
    const gray = round >= T.grayFrom, torn = round >= T.tornFrom;
    ctx.save();
    ctx.translate(x + w / 2, y + h / 2); ctx.rotate(-0.028); ctx.translate(-w / 2, -h / 2);
    ctx.save();
    ctx.shadowColor = 'rgba(24,26,33,0.20)'; ctx.shadowBlur = big ? 26 : 10; ctx.shadowOffsetY = big ? 8 : 3;
    ctx.fillStyle = '#fff'; rr(0, 0, w, h, 3); ctx.fill();
    ctx.restore();
    const pad = w * 0.06, capH = h * 0.155;
    const pw = w - pad * 2, ph = h - pad - capH;

    ctx.save();
    rr(pad, pad, pw, ph, 2); ctx.clip();
    if (torn) {
      ctx.beginPath();
      ctx.moveTo(pad, pad);
      ctx.lineTo(pad + pw, pad);
      for (let i = TEAR.length - 2; i >= 0; i -= 2) ctx.lineTo(pad + pw * TEAR[i], pad + ph * TEAR[i + 1]);
      ctx.closePath(); ctx.clip();
    }
    const bg = ctx.createLinearGradient(0, pad, 0, pad + ph);
    bg.addColorStop(0, '#e8eaf1'); bg.addColorStop(1, '#cfd4e0');
    ctx.fillStyle = bg; ctx.fillRect(pad, pad, pw, ph);
    if (gray && 'filter' in ctx) ctx.filter = 'grayscale(1) contrast(1.06)';
    // Standing still, feet near the bottom, generous headroom — a balloon on a string has to
    // fit in the frame or the photo would be hiding a thing the crowd shows.
    if (g) drawPerson(g, pad + pw / 2, pad + ph * 0.985, ph * 0.82, 0, { shadow: false });
    if ('filter' in ctx) ctx.filter = 'none';
    ctx.restore();

    ctx.strokeStyle = ink(0.16); ctx.lineWidth = 1; rr(pad + 0.5, pad + 0.5, pw - 1, ph - 1, 2); ctx.stroke();
    ctx.strokeStyle = ink(0.13); rr(0.5, 0.5, w - 1, h - 1, 3); ctx.stroke();
    type('CASE ' + caseNo(), pad + pw / 2, pad + ph + capH * 0.55, ink(0.42), big ? 12 : Math.max(7, w * 0.105), 700, 1.4);
    if (torn) type('TORN', w - pad, pad + ph * 0.1, RED, big ? 10 : 7, 700, 1, 'right');
    ctx.restore();
  }

  // ---------- arcade type ----------
  // `maxW` is the whole mobile story. Monospace at a fixed size and a fixed tracking will
  // happily run off both edges of a 360px phone, so anything that spans the screen says how
  // much room it has and gets scaled — size AND tracking together, or the letters bunch up
  // while the gaps stay put.
  function type(text, x, y, color, size, weight, sp, align, maxW) {
    weight = weight || 700; sp = sp === undefined ? 2 : sp;
    const setFont = () => {
      if ('letterSpacing' in ctx) ctx.letterSpacing = sp + 'px';
      ctx.font = `${weight} ${size}px ui-monospace, monospace`;
    };
    setFont();
    if (maxW > 0) {
      const w = ctx.measureText(text).width;
      if (w > maxW) { const k = maxW / w; size *= k; sp *= k; setFont(); }
    }
    ctx.fillStyle = color;
    ctx.textAlign = align || 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y);
    if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
  }
  function hairline(y, w, alpha) {
    ctx.strokeStyle = ink(alpha); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(W / 2 - w / 2, y + 0.5); ctx.lineTo(W / 2 + w / 2, y + 0.5); ctx.stroke();
  }
  const blinkUI = () => ((performance.now() / 460) | 0) % 2 === 0;
  function statStrip(items, y) {
    const gap = Math.min(110, (W - 40) / items.length);
    items.forEach(([k, v, color], i) => {
      const x = W / 2 + (i - (items.length - 1) / 2) * gap;
      type(k, x, y, ink(0.32), 9, 700, 1.5);
      type(v, x, y + 21, color || ink(0.82), 15, 700, 0);
      if (i < items.length - 1) {
        ctx.strokeStyle = ink(0.11); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo((x + gap / 2) + 0.5, y - 7); ctx.lineTo((x + gap / 2) + 0.5, y + 29); ctx.stroke();
      }
    });
  }
  const fmtTime = (s) => {
    const t = Math.max(0, Math.floor(s));
    return t < 60 ? t + 's' : `${(t / 60) | 0}m ${String(t % 60).padStart(2, '0')}s`;
  };

  // ---------- the readouts ----------
  // Nothing is in a box. The crowd runs edge to edge and the numbers float on top of it inside
  // a soft white bloom — a panel would cost a strip of board, and the board is the game.
  function drawHud() {
    const hot = clock < 10 && !inIntro();
    ctx.save();
    ctx.shadowColor = 'rgba(255,255,255,0.95)'; ctx.shadowBlur = 9;

    // The score column and the announcer share the top edge, so the announcer is only ever
    // given the room the score column isn't using. On a phone that's not enough for a sentence
    // — hence the short forms below. Squeezing "TARGET IS ABOUT TO LEAVE THE SCREEN" into
    // 200px would technically fit and be unreadable, which is the same as not drawing it.
    const pad = NARROW ? 14 : 26;
    const num = NARROW ? 22 : 28, lab = NARROW ? 8 : 9;
    type(String(found), W - pad, NARROW ? 28 : 36, ink(0.92), num, 800, 0, 'right');
    type('FOUND', W - pad, NARROW ? 46 : 60, ink(0.34), lab, 700, 1.5, 'right');
    type('ROUND ' + round, W - pad, NARROW ? 62 : 78, ACCENT_D, lab, 700, 1.5, 'right');

    const cx = W / 2, side = NARROW ? 76 : 116;
    const bw = Math.max(120, W - side * 2);      // what's left between the two score columns
    const big = NARROW ? 11 : 13, small = NARROW ? 8 : 9;
    const y1 = NARROW ? 28 : 36, y2 = NARROW ? 48 : 60, y3 = NARROW ? 66 : 78;

    if (inIntro()) {
      type(NARROW ? 'TARGET ENTERING' : 'TARGET IS ENTERING THE SCREEN', cx, y1, ACCENT_D, big, 800, 3, 'center', bw);
      type('CASE ' + caseNo(), cx, y2, ink(0.34), small, 700, 1.5, 'center', bw);
    } else if (msg && msg.t < msg.dur) {
      const a = Math.min(1, (msg.dur - msg.t) / 0.25);
      ctx.globalAlpha = a;
      type(msg.text, cx, y1, msg.color, big, 800, 3, 'center', bw);
      if (msg.sub) type(msg.sub, cx, y2, ink(0.34), small, 700, 1.5, 'center', bw);
      ctx.globalAlpha = 1;
    } else {
      // No number. The room reddening and the tick underneath it already say how long is left,
      // and both of those you can take in without looking away from the crowd — which is the
      // only place you can afford to be looking.
      if (hot) {
        ctx.globalAlpha = 0.55 + Math.abs(Math.sin(tNow * 5)) * 0.45;
        type(NARROW ? 'ABOUT TO LEAVE' : 'TARGET IS ABOUT TO LEAVE THE SCREEN', cx, y1, RED, big, 800, 3, 'center', bw);
        ctx.globalAlpha = 1;
      } else {
        type(NARROW ? 'IN THE CROWD' : 'TARGET IS IN THE CROWD', cx, y1, ink(0.4), NARROW ? 9 : 10, 700, 2, 'center', bw);
      }
    }
    if (misses > 0 && !inIntro()) type(misses + ' WRONG', cx, y3, RED, small, 700, 1.5, 'center', bw);
    ctx.restore();

    // The photo only exists while there's a case open. On the title and on the scoreboard it
    // would just be a loose prop sitting in the corner of somebody else's screen.
    if (state === PLAY || state === FOUND) {
      const r = cardRect();
      drawCard(r.x, r.y, r.w, r.h, target ? target.g : null, r.h > 190);
    }
  }

  // ---------- confetti & floating numbers ----------
  function burst(x, y, colors, n) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), s = rand(60, 260);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: 1,
                   r: rand(2, 5), rot: rand(0, TAU), spin: rand(-9, 9), color: colors[ri(colors.length)] });
    }
  }
  function floater(text, x, y, color, size) {
    floaters.push({ text, x, y, color, size: size || 17, life: 1.2 });
  }

  // ---------- run flow ----------
  // How long the target stays in the room. It shrinks every round, and it's the only thing
  // that ends a run — nothing carries over, so a round you scraped through by half a second
  // doesn't punish the next one, and one you nailed doesn't bankroll it either.
  const roundTime = () => Math.max(T.timeMin, T.timeBase - round * T.timeDecay);

  function resetAttract() {
    state = MENU; found = 0; round = 1; elapsed = 0;
    clock = roundTime();
    parts = []; floaters = []; ripples = []; shake = 0; flash = 0; dread = 0;
    buildRound();
  }
  function startRun() {
    found = 0; round = 1; elapsed = 0; lastTick = 99;
    clock = roundTime();
    parts = []; floaters = []; ripples = []; shake = 0; flash = 0; dread = 0;
    state = PLAY;
    buildRound();
    sndRound();
    if (window.trackGame) trackGame('game_start', 'wanted');
  }
  function nextRound() {
    round = found + 1;
    clock = roundTime();
    state = PLAY;
    buildRound();
    sndRound();
  }
  function hit(p) {
    if (inIntro()) return;                    // the briefing is not a round yet
    if (p === target) {
      found++;
      best = Math.max(best, found);
      state = FOUND; foundAt = tNow;
      const h = personH(p);
      burst(p.x, p.y - h * 0.6, [ACCENT, GOOD, GOLD, '#f5c518', '#e91e8c'], 26);
      floater('GOT THEM', p.x, p.y - h - 16, GOOD, 17);
      say(NARROW ? 'IDENTIFIED' : 'TARGET IDENTIFIED', GOOD,
          NARROW ? 'CASE ' + caseNo() : 'CASE ' + caseNo() + ' CLOSED', 1.2);
      sndFound();
    } else {
      if (p.wrong) return;                    // already crossed off, already paid for
      p.wrong = true; misses++;
      const cost = Math.min(T.missCap, T.missBase + (misses - 1) * T.missStep);
      clock -= cost;
      const h = personH(p);
      floater('−' + cost + 's', p.x, p.y - h - 14, RED, 17);
      say(NARROW ? 'NOT THEM' : 'NOT YOUR TARGET', RED, '−' + cost + ' SECONDS', 1.1);
      shake = 1; flash = 1;
      sndMiss();
      if (clock <= 0) { clock = 0; timeUp(); }
    }
  }
  function timeUp() {
    if (state === DEAD) return;
    state = DEAD; deadAt = tNow;
    // They don't vanish, they walk out. You get to watch the person you were looking for
    // stroll off the side of the screen, which is a far worse way to lose than a red banner.
    // They should already be at the edge by now — the commit rule saw this coming. So the beat
    // before the scoreboard is measured, not fixed: if they're gone, there is nothing left to
    // watch and sitting on an empty crowd for two seconds just reads as the game hanging.
    let gone = true;
    if (target) {
      const h = personH(target);
      gone = target.x < xMin - h * 0.7 || target.x > xMax + h * 0.7;
      target.escaping = true; target.entering = false; target.pause = 0;
    }
    hold = gone ? T.holdGone : T.holdLeaving;
    say('TARGET LEFT THE SCREEN', RED, null, 2.4);
    localStorage.setItem('wanted_best', String(best));
    sndLeave();
    sndOver();
    if (window.trackGame) {
      // The run's own clock, not wall time: it stops for the briefing beat between rounds and
      // for a backgrounded tab, either of which would otherwise hand GA4 a run far longer than
      // anyone actually played.
      trackGame('game_end', 'wanted', { score: found, duration_sec: Math.round(elapsed) });
    }
  }

  // ---------- input ----------
  // One verb: you point at somebody. It resolves the instant the pointer goes down, on a mouse
  // and on a finger alike — waiting for the release to disambiguate a gesture would make every
  // accusation land late, and by then they've walked.
  let press = null, magnify = false, magT = 0;
  const keys = Object.create(null);

  function localPt(e) {
    const r = cvs.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  const inRect = (p, r, pad) => p.x > r.x - pad && p.x < r.x + r.w + pad && p.y > r.y - pad && p.y < r.y + r.h + pad;
  const inCard = (p) => inRect(p, cardRect(), 8);

  function primary() {
    ac();
    if (state === MENU) { startRun(); return true; }
    if (state === DEAD) { if (tNow - deadAt > hold + 0.5) startRun(); return true; }
    return false;
  }
  window.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const p = localPt(e);
    // While the photo is up, the only thing a click can do is put it down again. Otherwise the
    // gesture that enlarges it would also be the gesture that accuses somebody.
    if (magnify) { magnify = false; press = null; sndCard(false); return; }
    const started = primary();
    const onCard = inCard(p);
    press = { id: e.pointerId, t: performance.now(), x: p.x, y: p.y, cx: p.x, cy: p.y, moved: 0, started, card: onCard };
    if (onCard && !started) { magnify = true; sndCard(true); return; }
    if (!started && !onCard && state === PLAY) {
      const hitP = pickAt(p.x, p.y);
      // A click into a gap costs nothing, but it still has to look like it arrived. Without
      // this the game and a dropped input are indistinguishable, and you start hammering.
      if (hitP) hit(hitP); else ripples.push({ x: p.x, y: p.y, life: 1 });
    }
  }, { passive: false });
  window.addEventListener('pointermove', (e) => {
    const p = localPt(e);
    if (!press || e.pointerId !== press.id) return;
    press.moved = Math.max(press.moved, Math.hypot(p.x - press.x, p.y - press.y));
    press.cx = p.x; press.cy = p.y;
  }, { passive: false });
  function endPress(e) {
    if (!press || e.pointerId !== press.id) return;
    press = null;
  }
  window.addEventListener('pointerup', (e) => { e.preventDefault(); endPress(e); }, { passive: false });
  window.addEventListener('pointercancel', endPress);
  window.addEventListener('keydown', (e) => {
    if (['Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
    keys[e.code] = true;
    if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) primary();
    if (e.code === 'KeyF' && !e.repeat && state === PLAY) { ac(); magnify = !magnify; }
    // A room tone that never stops needs a way to stop it.
    if (e.code === 'KeyM' && !e.repeat) {
      muted = !muted;
      if (master) master.gain.setTargetAtTime(muted ? 0 : 1, AC.currentTime, 0.08);
    }
  });
  // A crowd murmuring away in a tab nobody is looking at is just a fault report waiting to
  // happen. The context sleeps with the page and the ambience picks up where it left off.
  document.addEventListener('visibilitychange', () => {
    if (!AC) return;
    if (document.hidden) AC.suspend(); else AC.resume();
  });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; press = null; });
  window.addEventListener('contextmenu', (e) => e.preventDefault());
  const band = document.getElementById('band');
  band.addEventListener('pointerdown', (e) => e.stopPropagation());
  band.addEventListener('pointerup', (e) => e.stopPropagation());

  // ---------- update ----------
  function update(dt) {
    tNow += dt;
    if (state !== PLAY) magnify = false;
    magT = clamp(magT + (magnify ? dt / 0.26 : -dt / 0.22), 0, 1);

    if (msg) msg.t += dt;
    if (state === PLAY && introT < 9) {
      introT += dt;
      if (introT >= T.introHold + T.introFly) introT = 9;
    }
    if (state === PLAY && !inIntro()) {
      elapsed += dt;
      clock -= dt;
      const s = Math.ceil(clock);
      if (s <= 8 && s !== lastTick && s > 0) sndTick(s <= 4);
      lastTick = s;
      if (clock <= 0) { clock = 0; timeUp(); }
    }
    // The red tide is a fraction of the round's own window, not a fixed number of seconds —
    // by round fifteen the whole window is what round one called "nearly out of time".
    const dTarget = state === PLAY && !inIntro() ? clamp(1 - clock / (roundTime() * 0.42), 0, 1) : 0;
    dread += (dTarget - dread) * Math.min(1, dt * (dTarget > dread ? 2.2 : 1.4));

    // The crowd keeps walking while the target escapes, then the whole scene stops on the
    // arrangement that beat you.
    const escaping = state === DEAD && tNow - deadAt < hold + 0.4;
    if (state === MENU || state === PLAY || escaping) updateCrowd(dt);
    if (state === FOUND && tNow - foundAt > 0.95) nextRound();

    // The room fills out with the crowd, pulls back under the photo, and tightens as the
    // window closes. Same three numbers the picture is already using.
    ambience(state === DEAD ? 0.012 : 0.026 + Math.min(0.034, people.length / 2400),
             magnify || inIntro(), state === PLAY ? dread : 0, dt);

    shake = Math.max(0, shake - dt * 3.4);
    flash = Math.max(0, flash - dt * 2.6);
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt * 0.9; p.vy += 520 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.spin * dt;
      if (p.life <= 0) parts.splice(i, 1);
    }
    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i];
      f.life -= dt * 0.85; f.y -= dt * 26;
      if (f.life <= 0) floaters.splice(i, 1);
    }
    for (let i = ripples.length - 1; i >= 0; i--) {
      ripples[i].life -= dt * 3.2;
      if (ripples[i].life <= 0) ripples.splice(i, 1);
    }
  }

  // ---------- draw ----------
  function drawFloor() {
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    // A hint of ground under the back row and nothing else. The crowd is the picture; a
    // textured plaza behind sixty people is just noise you have to see past.
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'rgba(24,26,33,0.06)');
    g.addColorStop(0.4, 'rgba(24,26,33,0.012)');
    g.addColorStop(1, 'rgba(24,26,33,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // No progress bar. The room itself goes red from the edges in as the target's window
    // closes — peripheral, unreadable as a number, impossible to miss.
    if (dread > 0.01) {
      ctx.fillStyle = `rgba(229,52,43,${0.05 * dread})`;
      ctx.fillRect(0, 0, W, H);
      const r = ctx.createRadialGradient(W / 2, H * 0.55, Math.min(W, H) * 0.16, W / 2, H * 0.55, Math.max(W, H) * 0.72);
      r.addColorStop(0, 'rgba(229,52,43,0)');
      r.addColorStop(1, `rgba(229,52,43,${0.36 * dread})`);
      ctx.fillStyle = r; ctx.fillRect(0, 0, W, H);
    }
  }

  function drawCrowd() {
    for (const p of people) {
      const h = personH(p);
      const moving = p.pause <= 0;
      drawPerson(p.g, p.x, p.y, h, moving ? p.ph : 0, {
        lean: moving ? p.dir * 0.045 : 0,
        blink: p.blink < 0,
        dim: p.wrong,
        mark: p.wrong,
      });
    }
  }

  // A hole punched in a dark sheet. Used twice — once to celebrate, once to rub it in.
  function spotlight(p, r, alpha) {
    const h = personH(p), cy = p.y - h * 0.55;
    ctx.save();
    ctx.fillStyle = `rgba(20,22,29,${alpha})`;
    ctx.beginPath(); ctx.rect(0, 0, W, H);
    ctx.arc(p.x, cy, r, 0, TAU, true);
    ctx.fill('evenodd');
    ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 2;
    circle(p.x, cy, r); ctx.stroke();
    ctx.restore();
    drawPerson(p.g, p.x, p.y, h, 0, { lean: 0 });
  }

  // Same ladder as every other game in here: title, hairline, one or two quiet subtitle lines,
  // the blinking call to action, and the best score parked at the bottom edge.
  function drawMenu() {
    ctx.fillStyle = 'rgba(255,255,255,0.74)'; ctx.fillRect(0, 0, W, H);
    const cy = H * 0.30, mw = W - 32;
    type('WANTED', W / 2, cy, ink(0.93), Math.min(64, W * 0.15), 800, 10, 'center', mw);
    hairline(cy + 32, Math.min(240, mw), 0.14);
    type('FIND THE FACE IN THE PHOTO', W / 2, cy + 54, ACCENT_D, 12, 700, 4, 'center', mw);
    type(NARROW ? 'THEY WALK IN  ·  FIND THEM BEFORE THEY WALK OUT'
               : 'THEY WALK IN  ·  YOU HAVE UNTIL THEY WALK OUT',
         W / 2, cy + 76, ink(0.42), 10, 700, 2, 'center', mw);
    if (blinkUI()) type(IS_TOUCH ? 'TAP TO START' : 'PRESS SPACE TO START', W / 2, cy + 122, ink(0.85), 13, 800, 3, 'center', mw);
    if (best > 0) type('BEST  ' + best, W / 2, H - 30, ink(0.3), 10, 700, 2, 'center', mw);
  }

  function drawGameOver() {
    const t = tNow - deadAt;
    // No reveal. They walked out of the side of the screen with everybody else and you don't
    // get to find out which one they were — that's the entire cost of missing the window.
    if (t < hold) {
      ctx.save();
      ctx.shadowColor = 'rgba(255,255,255,0.95)'; ctx.shadowBlur = 9;
      ctx.globalAlpha = clamp(t / 0.25, 0, 1);
      type(NARROW ? 'TARGET LEFT' : 'TARGET LEFT THE SCREEN', W / 2, NARROW ? 28 : 36, RED,
           NARROW ? 11 : 13, 800, 3, 'center', W - 32);
      ctx.restore();
    }
    const o = clamp((t - hold) / 0.4, 0, 1);
    if (o <= 0) return;
    ctx.globalAlpha = o;
    ctx.fillStyle = 'rgba(255,255,255,0.76)'; ctx.fillRect(0, 0, W, H);
    const cy = H * 0.28, isBest = found >= best && found > 0, mw = W - 32;
    type('THEY GOT AWAY', W / 2, cy - 44, RED, Math.min(48, W * 0.12), 800, 6, 'center', mw);
    type(NARROW ? 'THE TARGET LEFT' : 'THE TARGET LEFT THE SCREEN', W / 2, cy - 8, ink(0.34), 9, 700, 2, 'center', mw);
    hairline(cy + 16, Math.min(200, mw), 0.13);
    // Count up to the total rather than snapping to it — a beat of tally before it settles.
    const count = clamp((t - hold) / 0.7, 0, 1);
    type(String(Math.round(found * (1 - Math.pow(1 - count, 3)))), W / 2, cy + 66, ink(0.93), Math.min(68, W * 0.16), 800, 0, 'center', mw);
    type(isBest ? '★  NEW BEST' : 'FACES FOUND', W / 2, cy + 112, isBest ? GOLD : ink(0.36), 9, 700, 2, 'center', mw);
    statStrip([['TIME', fmtTime(elapsed)], ['BEST', String(best)]], cy + 158);
    if (t > hold + 0.3 && blinkUI()) type(IS_TOUCH ? 'TAP TO PLAY AGAIN' : 'PRESS SPACE', W / 2, cy + 220, ink(0.85), 13, 800, 3, 'center', mw);
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 9, (Math.random() - 0.5) * shake * 9);

    drawFloor();
    drawCrowd();

    if (state === FOUND && target) {
      const t = tNow - foundAt;
      spotlight(target, personH(target) * (0.75 + Math.min(0.5, t * 1.4)), 0.5 * (1 - clamp((t - 0.55) / 0.4, 0, 1)));
    }
    if (state === DEAD) drawGameOver();

    for (const p of parts) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color; ctx.fillRect(-p.r, -p.r * 0.6, p.r * 2, p.r * 1.2);
      ctx.restore();
    }
    for (const f of floaters) {
      ctx.globalAlpha = Math.max(0, Math.min(1, f.life));
      type(f.text, f.x, f.y, f.color, f.size, 800, 0);
    }
    for (const r of ripples) {
      ctx.globalAlpha = Math.max(0, r.life) * 0.5;
      ctx.strokeStyle = INK; ctx.lineWidth = 1.5;
      circle(r.x, r.y, 6 + (1 - r.life) * 20); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    if (flash > 0) { ctx.fillStyle = `rgba(229,52,43,${flash * 0.16})`; ctx.fillRect(0, 0, W, H); }

    // The board goes dark behind the photo whenever it's up — held at the start of a round, or
    // called back mid-round. Same treatment either way, so the corner card reads as the same
    // object parked rather than a different widget.
    const lift = (state === PLAY || state === FOUND) ? cardLift() : 0;
    if (lift > 0.001) { ctx.fillStyle = `rgba(24,26,33,${0.34 * lift})`; ctx.fillRect(0, 0, W, H); }

    if (state === PLAY || state === FOUND) drawHud();

    if (state === MENU) drawMenu();
    ctx.restore();
  }

  // ---------- loop ----------
  resize();
  booted = true;
  resetAttract();
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
