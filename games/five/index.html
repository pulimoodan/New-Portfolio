<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<title>Five letters</title>
<style>
  :root {
    color-scheme: dark;
    --outline: #120d33;
    --cream: #fff6e3;   --cream-lip: #d8c49c;
    --green: #43d963;   --green-lip: #1e9b3c;
    --gold: #ffc83a;    --gold-lip: #d39400;
    --slate: #5b5f8a;   --slate-lip: #3a3d62;
    --tile: min(60px, calc((100vw - 72px) / 5.4), calc((100dvh - 400px) / 7));
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; overflow: hidden;
    background: #170f3f; color: #fff;
    font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #wrap {
    position: fixed; inset: 10px; bottom: 44px;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    gap: 8px; padding: 12px 8px 14px;
    border-radius: 18px; overflow: hidden;
    background:
      radial-gradient(90% 60% at 50% 30%, #4a2fb0 0%, #2a1a78 45%, #1a1050 100%);
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.06);
  }
  /* A slow field of soft dots behind everything, so the background never feels dead. */
  #wrap::before {
    content: ""; position: absolute; inset: -50%;
    background-image: radial-gradient(rgba(255,255,255,.07) 2px, transparent 2.5px);
    background-size: 34px 34px;
    animation: drift 40s linear infinite; pointer-events: none;
  }
  @keyframes drift { to { transform: translate(34px, 34px); } }
  #wrap > * { position: relative; }

  /* ---------- HUD ---------- */
  #hud { width: 100%; max-width: 480px; display: flex; align-items: flex-start; justify-content: center; gap: 36px; padding: 0 6px; }
  .stat { display: flex; align-items: center; gap: 6px; line-height: 1; }
  .stat svg { width: 28px; height: 28px; overflow: visible; }
  .stat .ol { stroke: var(--outline); stroke-width: 5; stroke-linejoin: round; }
  .stat span {
    font-size: 26px; font-weight: 900; color: #fff;
    -webkit-text-stroke: 5px var(--outline); paint-order: stroke fill; text-shadow: 0 3px 0 var(--outline);
    display: inline-block; transform-origin: center;
  }
  #streak { color: #ff9a3c; }

  #hud .spacer { flex: 1; }
  #wrap > #mute { position: absolute; top: 12px; right: 14px; z-index: 7; }
  #wrap > #restart { position: absolute; top: 12px; left: 14px; z-index: 7; }
  .icon { background: none; border: 0; padding: 2px; cursor: pointer; color: #fff; line-height: 0; }
  .icon svg { width: 30px; height: 30px; overflow: visible; transition: transform 160ms cubic-bezier(.3,1.6,.5,1); }
  .icon:hover svg { transform: scale(1.1); }
  .icon:active svg { transform: scale(.9); }
  #restart:hover svg { transform: scale(1.1) rotate(-40deg); }
  .icon .ol { stroke: var(--outline); stroke-width: 6; }
  .icon.off { color: #8a83c4; }

  /* ---------- board ---------- */
  #stage { perspective: 800px; flex: 1; display: grid; place-items: center; min-height: 0; position: relative; }
  #board {
    display: grid; grid-template-rows: repeat(6, var(--tile)); gap: calc(var(--tile) * 0.13);
    transform-style: preserve-3d;
    transform: rotateX(calc(6deg + var(--rx, 0deg))) rotateY(var(--ry, 0deg));
    transition: transform 500ms cubic-bezier(.2,.8,.2,1);
  }
  .row { display: grid; grid-template-columns: repeat(5, var(--tile)); gap: calc(var(--tile) * 0.13); transform-style: preserve-3d; }
  .tile { position: relative; width: var(--tile); height: var(--tile); transform-style: preserve-3d; }
  /* The empty slot the block sits in. */
  .slot {
    position: absolute; inset: 0; border-radius: 14px;
    background: rgba(8, 4, 30, .45);
    box-shadow: inset 0 4px 0 rgba(0,0,0,.35), 0 2px 0 rgba(255,255,255,.07);
  }
  .cube { position: absolute; inset: 0; transform-style: preserve-3d; }
  .face {
    position: absolute; inset: 0; border-radius: 14px;
    display: grid; place-items: center;
    font-size: calc(var(--tile) * 0.56); font-weight: 900; text-transform: uppercase;
    border: 3px solid var(--outline);
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    overflow: hidden;
  }
  /* Candy gloss: a bright band across the upper half of every block. */
  .face::before {
    content: ""; position: absolute; left: 8%; right: 8%; top: 6%; height: 34%;
    border-radius: 10px 10px 40% 40%;
    background: linear-gradient(180deg, rgba(255,255,255,.75), rgba(255,255,255,.08));
    pointer-events: none;
  }
  .face span { position: relative; }
  .front {
    background: var(--cream); color: var(--outline);
    box-shadow: inset 0 -7px 0 var(--cream-lip);
    opacity: 0; transform: scale(.6);
  }
  .tile.filled .front { opacity: 1; transform: none; }
  .back { transform: rotateX(180deg); color: var(--outline); }
  .back.correct { background: var(--green); box-shadow: inset 0 -7px 0 var(--green-lip); }
  .back.present { background: var(--gold);  box-shadow: inset 0 -7px 0 var(--gold-lip); }
  .back.absent  { background: var(--slate); box-shadow: inset 0 -7px 0 var(--slate-lip); color: #fff; }
  .back.absent::before { opacity: .35; }
  .drop {
    position: absolute; inset: 0; border-radius: 14px; background: var(--outline);
    transform: translateY(5px); opacity: 0;
  }
  .tile.filled .drop, .tile.shown .drop { opacity: 1; }

  /* ---------- banners and popups ---------- */
  #banner {
    position: absolute; left: 50%; top: 42%; z-index: 6;
    transform: translate(-50%, -50%) scale(0);
    font-size: clamp(30px, 9vw, 52px); font-weight: 900; white-space: nowrap; letter-spacing: 1px;
    color: #fff; -webkit-text-stroke: 7px var(--outline); paint-order: stroke fill;
    text-shadow: 0 6px 0 var(--outline);
    pointer-events: none;
  }
  #toast {
    position: absolute; left: 50%; top: 4px; z-index: 6;
    transform: translate(-50%, -20px) scale(.6); opacity: 0;
    color: #fff; -webkit-text-stroke: 5px var(--outline); paint-order: stroke fill; text-shadow: 0 3px 0 var(--outline);
    font-weight: 900; font-size: 18px; white-space: nowrap; pointer-events: none;
  }
  .pop {
    position: fixed; z-index: 7; pointer-events: none;
    font-weight: 900; font-size: 28px; color: var(--gold);
    -webkit-text-stroke: 6px var(--outline); paint-order: stroke fill; text-shadow: 0 4px 0 var(--outline);
  }
  #again {
    display: none; position: absolute; left: 50%; bottom: 8%; z-index: 6; transform: translateX(-50%);
    font: inherit; font-weight: 900; font-size: 24px; color: var(--green); cursor: pointer;
    background: none; border: 0; padding: 8px 12px; white-space: nowrap;
    -webkit-text-stroke: 6px var(--outline); paint-order: stroke fill; text-shadow: 0 4px 0 var(--outline);
  }
  #again.show { display: block; animation: bob 1.2s ease-in-out infinite; }
  #again:active { transform: translateX(-50%) translateY(3px) scale(.96); }
  @keyframes bob { 50% { transform: translateX(-50%) translateY(-5px) rotate(-2deg); } }

  /* ---------- keyboard ---------- */
  #keys { width: 100%; max-width: 500px; display: grid; gap: 9px; }
  .krow { display: flex; gap: 5px; justify-content: center; }
  .key {
    position: relative; overflow: hidden;
    flex: 1; max-width: 44px; height: min(52px, 7.2dvh);
    font: inherit; font-size: 17px; font-weight: 900; text-transform: uppercase;
    color: #fff; background: #4b3fa6; border: 3px solid var(--outline); border-radius: 11px;
    box-shadow: inset 0 -5px 0 #33298a, 0 4px 0 var(--outline);
    transform: translateY(0); cursor: pointer;
    transition: transform 60ms, box-shadow 60ms;
  }
  .key::before {
    content: ""; position: absolute; left: 10%; right: 10%; top: 5%; height: 30%; border-radius: 8px 8px 40% 40%;
    background: linear-gradient(180deg, rgba(255,255,255,.4), rgba(255,255,255,0));
  }
  .key svg { position: relative; width: 26px; height: 26px; vertical-align: middle; filter: drop-shadow(0 2px 0 rgba(18,13,51,.6)); }
  .key.wide { max-width: 70px; flex: 1.55; font-size: 12px; letter-spacing: .5px; }
  .key.down { transform: translateY(4px); box-shadow: inset 0 -3px 0 #33298a, 0 0 0 var(--outline); }
  .key.correct { background: var(--green); color: var(--outline); box-shadow: inset 0 -5px 0 var(--green-lip), 0 4px 0 var(--outline); }
  .key.present { background: var(--gold);  color: var(--outline); box-shadow: inset 0 -5px 0 var(--gold-lip), 0 4px 0 var(--outline); }
  .key.absent  { background: #2c2760; color: #9d97c9; box-shadow: inset 0 -5px 0 #1f1a4a, 0 4px 0 var(--outline); }
  .key.absent::before { opacity: .2; }
  @media (max-width: 480px) {
    #keys { gap: 8px; margin: 0 -4px; width: calc(100% + 8px); }
    .krow { gap: 4px; }
    .key { max-width: none; height: min(58px, 8dvh); border-width: 2px; border-radius: 9px; font-size: 19px; box-shadow: inset 0 -4px 0 #33298a, 0 3px 0 var(--outline); }
    .key.wide { max-width: none; }
    .key.down { transform: translateY(3px); box-shadow: inset 0 -2px 0 #33298a, 0 0 0 var(--outline); }
    .key.correct { box-shadow: inset 0 -4px 0 var(--green-lip), 0 3px 0 var(--outline); }
    .key.present { box-shadow: inset 0 -4px 0 var(--gold-lip), 0 3px 0 var(--outline); }
    .key.absent  { box-shadow: inset 0 -4px 0 #1f1a4a, 0 3px 0 var(--outline); }
    /* Phone order: Z to M, then delete, then enter on the far right. */
    .key[data-k="Enter"] { order: 1; }
    .key.wide { flex: 1.3; }
  }
  /* "×2" in a revealed tile's corner: you typed this letter once, but the word has it twice.
     Plain outlined text, no box. */
  .face .times {
    position: absolute; top: 3px; right: 5px; z-index: 1; line-height: 1;
    font-size: calc(var(--tile) * 0.22); font-weight: 900; color: #fff; text-transform: none;
    -webkit-text-stroke: 3px var(--outline); paint-order: stroke fill;
  }

  #fx { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 8; }
  #flash { position: fixed; inset: 0; pointer-events: none; z-index: 5; background: #fff; opacity: 0; }
  #band {
    position: fixed; left: 10px; right: 10px; bottom: 0; height: 44px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10px; font-weight: 700; letter-spacing: 2px; color: #a59fd6;
  }
  #band a { color: #fff; text-decoration: underline; }
</style>

  }
  function puff(x, y, w, colors, n) {
    for (let i = 0; i < amt(n); i++) {
      const side = i % 2 ? 1 : -1;
      add({ k: 'puff', x: x + side * w * 0.3, y, vx: side * (1 + Math.random() * 2.5), vy: -Math.random() * 1.5, r: 3 + Math.random() * 3,
            color: colors[i % colors.length], life: 22, max: 22, g: 0, drag: 0.9 });
    }
  }
  function burst(kind, x, y, w, combo) {
    const cols = COL[kind];
    if (kind === 'absent') { puff(x, y + w * 0.4, w, cols, 6); return; }
    const big = kind === 'correct';
    add({ k: 'ring', x, y, r0: w * 0.4, r1: w * (big ? 1.3 : 1), color: cols[0], life: 22, max: 22, w: big ? 8 : 6 });
    const n = amt(big ? 14 + combo * 3 : 10);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + Math.random() * 0.4, sp = (big ? 5 : 3.5) + Math.random() * 4;
      star(x, y, Math.cos(a) * sp, Math.sin(a) * sp - 2, (big ? 7 : 5.5) + Math.random() * 5, cols[i % cols.length], 40 + Math.random() * 20);
    }
  }
  function confetti(x, y, w, n = 120) {
    const pal = ['#43d963', '#ffc83a', '#ff6b9d', '#4fc3ff', '#ffffff', '#b98cff'];
    for (let i = 0; i < amt(n); i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4, sp = 9 + Math.random() * 12;
      if (i % 3 === 0) star(x + (Math.random() - 0.5) * w, y, Math.cos(a) * sp, Math.sin(a) * sp, 8 + Math.random() * 6, pal[i % pal.length], 110);
      else add({ k: 'paper', x: x + (Math.random() - 0.5) * w, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, w: 8 + Math.random() * 6, h: 5 + Math.random() * 4,
                 color: pal[i % pal.length], life: 160 + Math.random() * 60, max: 220, g: 0.32, drag: 0.975, a: Math.random() * 6, va: (Math.random() - 0.5) * 0.4, flip: Math.random() * 6 });
    }
  }
  function drawStar(x, y, r, a) {
    g.beginPath();
    for (let i = 0; i < 10; i++) {
      const rr = i % 2 ? r * 0.45 : r, an = a + i * Math.PI / 5;
      g[i ? 'lineTo' : 'moveTo'](x + Math.cos(an) * rr, y + Math.sin(an) * rr);
    }
    g.closePath();
  }
  function tick() {
    g.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 40);
    g.lineJoin = 'round';
    for (const p of parts) {
      p.life--;
      const k = p.life / p.max;
      if (p.k === 'ring') {
        const e = 1 - Math.pow(k, 3);
        g.globalAlpha = k; g.strokeStyle = p.color; g.lineWidth = p.w * k + 1;
        g.beginPath(); g.arc(p.x, p.y, p.r0 + (p.r1 - p.r0) * e, 0, Math.PI * 2); g.stroke();
        continue;
      }
      p.vy += p.g; p.vx *= p.drag; p.vy *= p.drag; p.x += p.vx; p.y += p.vy;
      g.globalAlpha = Math.min(1, k * 3);
      if (p.k === 'star') {
        p.a += p.va;
        const s = p.s * (k < 0.3 ? k / 0.3 : 1);
        drawStar(p.x, p.y, s, p.a);
        g.fillStyle = p.color; g.strokeStyle = '#120d33'; g.lineWidth = 2.5; g.stroke(); g.fill();
      } else if (p.k === 'puff') {
        p.r += 0.25;
        g.fillStyle = p.color; g.beginPath(); g.arc(p.x, p.y, p.r * k + 1, 0, Math.PI * 2); g.fill();
      } else if (p.k === 'paper') {
        p.a += p.va; p.flip += 0.15;
        g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.scale(1, Math.cos(p.flip));
        g.fillStyle = p.color; g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        g.restore();
      }
    }
    g.globalAlpha = 1;
    if (parts.length) requestAnimationFrame(tick); else { running = false; g.clearRect(0, 0, innerWidth, innerHeight); }
  }

  restore();
})();
</script>
</body>
